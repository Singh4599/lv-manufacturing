<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <!-- Gradients -->
    <linearGradient id="chiliPowder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="turmericPowder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="woodBowl1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="cinnamonStick" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="bayLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.18" flood-color="#1F2937"/>
    </filter>
  </defs>

  <!-- Shadow below composition -->
  <ellipse cx="118" cy="155" rx="100" ry="16" fill="#1F2937" opacity="0.12"/>

  <!-- Bay leaves in background -->
  <g transform="translate(18, 55) rotate(-22)">
    <path d="M 0 40 C -15 20, -10 -5, 12 -20 C 35 -5, 40 20, 24 40 Z" fill="url(#bayLeaf)"/>
    <path d="M 12 -18 Q 12 10 12 38" stroke="#A3E635" stroke-width="1.2" fill="none" opacity="0.6"/>
  </g>
  <g transform="translate(68, 45) rotate(15)">
    <path d="M 0 35 C -12 18, -8 -4, 10 -16 C 28 -4, 32 18, 20 35 Z" fill="url(#bayLeaf)"/>
    <path d="M 10 -14 Q 10 8 10 33" stroke="#A3E635" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- Cinnamon Sticks -->
  <g transform="translate(4, 135) rotate(18)">
    <rect x="0" y="0" width="70" height="9" rx="4.5" fill="url(#cinnamonStick)" filter="url(#softShadow)"/>
    <line x1="3" y1="4.5" x2="67" y2="4.5" stroke="#FDE68A" stroke-width="0.75" opacity="0.5"/>
  </g>
  <g transform="translate(6, 148) rotate(12)">
    <rect x="0" y="0" width="65" height="8.5" rx="4.25" fill="url(#cinnamonStick)" filter="url(#softShadow)"/>
  </g>

  <!-- Red Chili Powder Bowl -->
  <g filter="url(#softShadow)">
    <!-- Wooden Bowl Base -->
    <ellipse cx="65" cy="120" rx="48" ry="24" fill="url(#woodBowl1)"/>
    <!-- Rim inner -->
    <ellipse cx="65" cy="116" rx="45" ry="21" fill="#78350F"/>
    <!-- Chili Powder Mound -->
    <path d="M 23 116 C 30 92, 60 74, 65 74 C 70 74, 100 92, 107 116 Z" fill="url(#chiliPowder)"/>
    <!-- Texture grains -->
    <ellipse cx="65" cy="100" rx="30" ry="12" fill="#EF4444" opacity="0.45"/>
    <circle cx="60" cy="88" r="1.5" fill="#FCA5A5" opacity="0.8"/>
    <circle cx="72" cy="94" r="1.5" fill="#FCA5A5" opacity="0.7"/>
    <circle cx="52" cy="104" r="1.8" fill="#FCA5A5" opacity="0.6"/>
  </g>

  <!-- Turmeric Powder Bowl -->
  <g filter="url(#softShadow)">
    <!-- Wooden Bowl Base -->
    <ellipse cx="140" cy="132" rx="42" ry="22" fill="url(#woodBowl1)"/>
    <!-- Rim inner -->
    <ellipse cx="140" cy="128" rx="39" ry="19" fill="#78350F"/>
    <!-- Turmeric Mound -->
    <path d="M 104 128 C 112 106, 136 88, 140 88 C 144 88, 168 106, 176 128 Z" fill="url(#turmericPowder)"/>
    <!-- Highlight -->
    <ellipse cx="140" cy="114" rx="26" ry="10" fill="#FDE047" opacity="0.45"/>
    <circle cx="136" cy="102" r="1.4" fill="#FEF08A" opacity="0.8"/>
    <circle cx="147" cy="110" r="1.6" fill="#FEF08A" opacity="0.7"/>
  </g>

  <!-- Whole Spices: Peppercorns & Cloves on right -->
  <g filter="url(#softShadow)">
    <!-- Peppercorns in small pile -->
    <circle cx="188" cy="132" r="4.5" fill="#1C1917"/>
    <circle cx="196" cy="130" r="4.2" fill="#292524"/>
    <circle cx="192" cy="137" r="4.8" fill="#0C0A09"/>
    <circle cx="203" cy="134" r="4.5" fill="#1C1917"/>
    <circle cx="199" cy="140" r="4.6" fill="#292524"/>
    <circle cx="185" cy="139" r="4.2" fill="#1C1917"/>
    <circle cx="191" cy="145" r="4.5" fill="#0C0A09"/>
    <circle cx="208" cy="142" r="4" fill="#1C1917"/>

    <!-- Small highlight on peppercorns -->
    <circle cx="187" cy="130.5" r="1.2" fill="#78716C" opacity="0.7"/>
    <circle cx="195" cy="128.5" r="1.2" fill="#78716C" opacity="0.7"/>
    <circle cx="198" cy="138.5" r="1.2" fill="#78716C" opacity="0.7"/>

    <!-- Star Anise petal -->
    <path d="M 205 118 C 210 114, 218 116, 218 122 C 216 127, 208 126, 205 118 Z" fill="#78350F"/>
    <circle cx="212" cy="120" r="1.8" fill="#FBBF24"/>
  </g>
</svg>
